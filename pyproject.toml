[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eviqvfl"
version = "0.1.0"
description = "Reference implementation for Evidential Quantum Vertical Federated Learning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch==2.6.0",
  "torchvision==0.21.0",
  "torchquantum==0.1.8",
  "numpy==2.0.2",
  "pandas==2.3.1",
  "matplotlib==3.9.4",
  "tqdm==4.67.1",
]

[tool.setuptools]
py-modules = [
  "data_utils",
  "evidence",
  "models",
  "paper_config",
  "training",
  "vqc",
]

[tool.setuptools.packages.find]
include = ["tc*"]

